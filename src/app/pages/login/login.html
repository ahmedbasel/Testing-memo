<div class="flex min-h-screen items-center justify-center bg-slate-50 px-4 py-8">

  <div class="w-full max-w-md">

    <!-- Logo / Title -->
    <div class="mb-8 text-center">

    <div
  class="mx-auto mb-5 flex h-28 w-45 items-center justify-center overflow-hidden"
>
  <img
    src="Elsewedy_Electric_Logo.svg.webp"
    alt="Elsewedy Electric"
    class="h-full w-full object-contain"
  />
</div>

      <h1 class="text-3xl font-bold tracking-tight text-slate-900">
       Testing Memo
      </h1>

      <p class="mt-2 text-sm text-slate-500">
        Sign in to your account
      </p>

    </div>

    <!-- Login Card -->
    <div
      class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8"
    >

      <form
        (ngSubmit)="login()"
        class="space-y-5"
      >

        <!-- Email -->
        <div>

          <label
            for="email"
            class="mb-2 block text-sm font-medium text-slate-700"
          >
            Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="Enter your email"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10"
          />

        </div>

        <!-- Password -->
        <div>

          <label
            for="password"
            class="mb-2 block text-sm font-medium text-slate-700"
          >
            Password
          </label>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Enter your password"
            class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:bg-white focus:ring-4 focus:ring-blue-500/10"
          />

        </div>

        <!-- Error Message -->
        @if (errorMessage) {

          <div
            class="rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-600"
          >
            {{ errorMessage }}
          </div>

        }

        <!-- Login Button -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white shadow-sm transition hover:bg-blue-700 active:scale-[0.99] disabled:cursor-not-allowed disabled:opacity-50"
        >
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>

      </form>

      <!-- Signup -->
      <div class="mt-6 border-t border-slate-100 pt-6 text-center">

        <p class="text-sm text-slate-500">
          Don't have an account?

          <a
            routerLink="/signup"
            class="font-semibold text-blue-600 transition hover:text-blue-700"
          >
            Create account
          </a>
        </p>

      </div>

    </div>

    <!-- Footer -->
    <p class="mt-6 text-center text-xs text-slate-400">
      Quality Control System
    </p>

  </div>

</div>
